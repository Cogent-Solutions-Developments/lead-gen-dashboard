name: Validate & Deploy to Vercel

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
      - development

permissions:
  contents: read

jobs:
  quality:
    if: ${{ github.event.action != 'closed' || github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit --incremental false
      - run: npm test
      - name: Test Autocall deployment validation
        run: node --test scripts/check-autocall-deployment.check.mjs
      - run: npm run build

  deploy_preview:
    if: ${{ github.event.action == 'closed' && github.event.pull_request.merged == true && github.base_ref == 'development' }}
    runs-on: ubuntu-latest
    needs: quality
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm install --global vercel@59.1.3
      - run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy preview
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          deployment_url="$(vercel deploy --prebuilt)"
          echo "url=${deployment_url}" >> "${GITHUB_OUTPUT}"

      - name: Validate deployed Autocall configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "${response_file}"' EXIT
          vercel curl /autocall --deployment "${DEPLOYMENT_URL}" -- \
            --fail --silent --show-error --retry 3 --retry-delay 5 \
            --connect-timeout 10 --max-time 60 --output "${response_file}"
          node scripts/check-autocall-deployment.mjs "${response_file}" light

  deploy_production:
    if: ${{ github.event.action == 'closed' && github.event.pull_request.merged == true && github.base_ref == 'main' }}
    runs-on: ubuntu-latest
    needs: quality
    concurrency:
      group: vercel-production
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm install --global vercel@59.1.3
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Stage production deployment
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          deployment_url="$(vercel deploy --prebuilt --prod --skip-domain)"
          echo "url=${deployment_url}" >> "${GITHUB_OUTPUT}"

      - name: Wait for staged deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: vercel inspect "${DEPLOYMENT_URL}" --wait --timeout=10m

      - name: Validate staged Autocall configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "${response_file}"' EXIT
          vercel curl /autocall --deployment "${DEPLOYMENT_URL}" -- \
            --fail --silent --show-error --retry 3 --retry-delay 5 \
            --connect-timeout 10 --max-time 60 --output "${response_file}"
          node scripts/check-autocall-deployment.mjs "${response_file}" light

      - name: Promote validated production deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: vercel promote "${DEPLOYMENT_URL}" --yes --timeout=10m
